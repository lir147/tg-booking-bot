[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-booking-bot"
version = "1.0.0"
description = "Telegram bot for small business: services, prices and appointment booking"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiogram>=3.13,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["bot", "bot.handlers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]  # Cyrillic UI strings are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
